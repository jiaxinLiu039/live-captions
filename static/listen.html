<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>听力练习 · Listening Practice</title>
<style>
:root, [data-theme="light"] {
  --bg: #ffffff; --bg-soft: #f7f6f3; --bg-hover: #efeeec;
  --border: #e9e9e7; --text: #37352f; --text-soft: #787774; --text-faint: #9b9a97;
  --accent: #2383e2; --accent-soft: #e7f3fb;
  --green: #0f7b3e; --green-soft: #e6f3ec;
  --orange: #d9730d; --orange-soft: #fbecdb;
  --shadow: 0 4px 12px rgba(15,15,15,0.08); --radius: 8px;
}
[data-theme="dark"] {
  --bg: #191919; --bg-soft: #202020; --bg-hover: #2a2a2a;
  --border: #333; --text: #e8e8e6; --text-soft: #9b9a97; --text-faint: #6b6b6b;
  --accent: #529CCA; --accent-soft: #1a3a52;
  --green: #4dab6f; --green-soft: #1a3328;
  --orange: #e9973f; --orange-soft: #3d2e1a;
  --shadow: 0 4px 12px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; transition: background 0.3s; }

.app { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }

/* Header */
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
.brand { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.spacer { flex: 1; }
.back-link { font-size: 13px; color: var(--accent); text-decoration: none; padding: 4px 10px; border-radius: 4px; }
.back-link:hover { background: var(--accent-soft); }
.theme-btn { width: 30px; height: 30px; border: 1px solid var(--border); background: var(--bg-soft); border-radius: 6px; cursor: pointer; font-size: 14px; display: grid; place-items: center; }

/* Main layout */
.main-content { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }

/* Video area */
.video-area { display: flex; align-items: center; justify-content: center; background: #000; position: relative; min-height: 200px; max-height: 55vh; }
.video-area video { width: 100%; height: 100%; max-height: 55vh; object-fit: contain; }
.video-area.empty { background: var(--bg-soft); min-height: 280px; }

/* Drop zone */
.drop-zone { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text-faint); cursor: pointer; transition: all 0.2s; }
.drop-zone:hover { background: var(--accent-soft); color: var(--accent); }
.drop-zone.dragover { background: var(--accent-soft); border: 2px dashed var(--accent); color: var(--accent); }
.drop-zone-icon { font-size: 48px; }
.drop-zone-title { font-size: 16px; font-weight: 500; }
.drop-zone-desc { font-size: 12px; }
.drop-zone.hidden { display: none; }

/* Subtitle overlay on video */
.subtitle-overlay { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); max-width: 90%; text-align: center; pointer-events: none; }
.subtitle-line { padding: 6px 16px; border-radius: 4px; font-size: 18px; font-weight: 500; line-height: 1.5; display: inline-block; margin-bottom: 4px; }
.subtitle-line.sub-en { background: rgba(0,0,0,0.7); color: #fff; }
.subtitle-line.sub-zh { background: rgba(0,0,0,0.6); color: #ffd700; font-size: 15px; }

/* Controls */
.controls { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--bg); }
.ctrl-btn { height: 32px; padding: 0 14px; border: 1px solid var(--border); background: var(--bg-soft); border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text); display: inline-flex; align-items: center; gap: 6px; transition: all 0.12s; }
.ctrl-btn:hover { background: var(--bg-hover); }
.ctrl-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.ctrl-btn.recording { background: var(--green); color: #fff; border-color: var(--green); }
.ctrl-select { height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-soft); color: var(--text); font-size: 13px; }
.speed-group { display: flex; align-items: center; gap: 4px; }
.speed-btn { width: 32px; height: 28px; border: 1px solid var(--border); background: var(--bg); border-radius: 4px; cursor: pointer; font-size: 11px; color: var(--text-soft); }
.speed-btn:hover { background: var(--bg-hover); }
.speed-btn.on { background: var(--text); color: var(--bg); border-color: var(--text); }

/* Transcript panel */
.transcript-panel { overflow-y: auto; padding: 16px 20px; }
.transcript-panel::-webkit-scrollbar { width: 6px; }
.transcript-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
.line-item { padding: 10px 14px; border-radius: var(--radius); margin-bottom: 4px; cursor: pointer; transition: background 0.12s; position: relative; }
.line-item:hover { background: var(--bg-soft); }
.line-item.active { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.line-time { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.line-en { font-size: 14px; color: var(--text); margin-top: 2px; line-height: 1.5; }
.line-zh { font-size: 13px; color: var(--text-soft); margin-top: 2px; line-height: 1.5; }
.line-zh.blurred { filter: blur(4px); cursor: pointer; transition: filter 0.3s; user-select: none; }
.line-zh.blurred:hover { filter: blur(2px); }
.line-zh.revealed { filter: none; }

/* Status bar */
.status-bar { padding: 8px 20px; font-size: 12px; color: var(--text-faint); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }

/* Empty transcript */
.transcript-empty { text-align: center; padding: 40px; color: var(--text-faint); }

@media (max-width: 768px) {
  .controls { flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
  .video-area { max-height: 40vh; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">🎧 听力练习</div>
    <div class="spacer"></div>
    <a class="back-link" href="/">← 返回字幕</a>
    <button class="theme-btn" id="themeBtn">🌙</button>
  </header>

  <div class="main-content">
    <div class="video-area empty" id="videoArea">
      <video id="videoPlayer" style="display:none;" controls></video>
      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">🎬</div>
        <div class="drop-zone-title">拖入视频/音频文件，或点击选择</div>
        <div class="drop-zone-desc">支持 MP4, WebM, MP3, WAV, OGG 等格式</div>
      </div>
      <input type="file" id="fileInput" style="display:none;" accept="video/*,audio/*" />
      <div class="subtitle-overlay" id="subtitleOverlay">
        <div class="subtitle-line sub-en" id="subEn" style="display:none;"></div>
        <br/>
        <div class="subtitle-line sub-zh" id="subZh" style="display:none;"></div>
      </div>
    </div>

    <div class="controls" id="controlsBar" style="display:none;">
      <button class="ctrl-btn" id="startBtn">▶ 开始识别</button>
      <select class="ctrl-select" id="subtitleMode">
        <option value="en-only">仅英文（练听力）</option>
        <option value="zh-only">仅中文（听中文）</option>
        <option value="en-blur-zh">英文 + 中文模糊（点击揭示）</option>
        <option value="both">英文 + 中文</option>
        <option value="none">关闭字幕</option>
      </select>
      <div class="speed-group">
        <span style="font-size:12px;color:var(--text-faint);">速度</span>
        <button class="speed-btn" data-speed="0.5">0.5</button>
        <button class="speed-btn" data-speed="0.75">0.75</button>
        <button class="speed-btn on" data-speed="1">1x</button>
        <button class="speed-btn" data-speed="1.25">1.25</button>
        <button class="speed-btn" data-speed="1.5">1.5</button>
      </div>
      <div class="spacer"></div>
      <button class="ctrl-btn" id="exportSubBtn">📥 导出字幕</button>
    </div>

    <div class="transcript-panel" id="transcriptPanel">
      <div class="transcript-empty" id="transcriptEmpty">导入视频后开始识别，字幕会显示在这里</div>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusText">等待导入视频…</span>
    <span class="spacer"></span>
    <span id="lineCount">0 句</span>
  </div>
</div>

<script>
// Theme
let darkMode = localStorage.getItem('theme') === 'dark' || (localStorage.getItem('theme') === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme() { document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light'); document.getElementById('themeBtn').textContent = darkMode ? '☀' : '🌙'; }
applyTheme();
document.getElementById('themeBtn').addEventListener('click', () => { darkMode = !darkMode; localStorage.setItem('theme', darkMode ? 'dark' : 'light'); applyTheme(); });

// Elements
const videoArea = document.getElementById('videoArea');
const videoPlayer = document.getElementById('videoPlayer');
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const controlsBar = document.getElementById('controlsBar');
const startBtn = document.getElementById('startBtn');
const subtitleMode = document.getElementById('subtitleMode');
const transcriptPanel = document.getElementById('transcriptPanel');
const transcriptEmpty = document.getElementById('transcriptEmpty');
const subEn = document.getElementById('subEn');
const subZh = document.getElementById('subZh');
const statusText = document.getElementById('statusText');
const lineCount = document.getElementById('lineCount');

let lines = []; // {id, en, zh, start, end, final}
let ws = null;
let audioCtx = null, sourceNode = null, workletNode = null;
let recognizing = false;
let currentLineIdx = -1;

// File import
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

function handleFile(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  videoPlayer.src = url;
  videoPlayer.style.display = 'block';
  dropZone.classList.add('hidden');
  videoArea.classList.remove('empty');
  controlsBar.style.display = 'flex';
  statusText.textContent = `已加载: ${file.name}`;
  videoPlayer.load();
}

// Playback speed
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    videoPlayer.playbackRate = parseFloat(btn.dataset.speed);
  });
});

// Start/stop recognition
startBtn.addEventListener('click', () => {
  if (recognizing) stopRecognition();
  else startRecognition();
});

async function startRecognition() {
  if (!videoPlayer.src) return;

  // Create AudioContext and capture video audio
  audioCtx = new AudioContext({ sampleRate: 16000 });
  sourceNode = audioCtx.createMediaElementSource(videoPlayer);
  sourceNode.connect(audioCtx.destination); // keep audio audible

  await audioCtx.audioWorklet.addModule('/static/audio-worker.js');
  workletNode = new AudioWorkletNode(audioCtx, 'capture-processor');
  sourceNode.connect(workletNode);
  workletNode.connect(audioCtx.destination);

  // Connect WebSocket
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?mode=full`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    statusText.textContent = '识别中…';
    // Send hotwords if any
    const hw = localStorage.getItem('hotwords') || '';
    if (hw) ws.send(JSON.stringify({ type: 'hotwords', data: hw }));
  };
  ws.onclose = () => { if (recognizing) { statusText.textContent = '连接断开'; } };
  ws.onmessage = (ev) => handleMessage(JSON.parse(ev.data));

  workletNode.port.onmessage = (e) => {
    if (e.data.type === 'pcm' && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(e.data.pcm16);
    }
  };

  recognizing = true;
  startBtn.textContent = '⏹ 停止识别';
  startBtn.classList.add('recording');
  videoPlayer.play();
}

function stopRecognition() {
  recognizing = false;
  startBtn.textContent = '▶ 开始识别';
  startBtn.classList.remove('recording');
  if (workletNode) { workletNode.disconnect(); workletNode = null; }
  if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (ws) { try { ws.send(new ArrayBuffer(0)); } catch {} ws.close(); ws = null; }
  statusText.textContent = `已停止 · ${lines.length} 句`;
}

// Handle server messages
function handleMessage(msg) {
  if (msg.type === 'config') return;
  if (msg.type === 'result') {
    const id = msg.sentence_id;
    let line = lines.find(l => l.id === id);
    if (!line) {
      line = { id, en: '', zh: '', start: videoPlayer.currentTime, end: null, final: false };
      lines.push(line);
    }
    if (msg.en !== undefined) line.en = msg.en;
    if (msg.en_final) { line.final = true; line.end = videoPlayer.currentTime; }
    renderTranscript();
    updateSubtitle();
  }
  if (msg.type === 'translation_stream') {
    const line = lines.find(l => l.id === msg.line_id);
    if (line) {
      line.zh = msg.accumulated;
      renderTranscript();
      updateSubtitle();
    }
  }
}

// Render transcript list
function renderTranscript() {
  if (lines.length === 0) return;
  if (transcriptEmpty.parentNode) transcriptEmpty.remove();
  lineCount.textContent = `${lines.length} 句`;

  transcriptPanel.innerHTML = '';
  const mode = subtitleMode.value;

  lines.forEach((line, i) => {
    const div = document.createElement('div');
    div.className = 'line-item' + (i === currentLineIdx ? ' active' : '');
    div.dataset.idx = i;

    let html = `<span class="line-time">${fmtTime(line.start)}</span>`;
    if (mode !== 'zh-only' && mode !== 'none') {
      html += `<div class="line-en">${escapeHtml(line.en || '')}</div>`;
    }
    if (mode === 'zh-only' || mode === 'both') {
      html += `<div class="line-zh">${escapeHtml(line.zh || '')}</div>`;
    } else if (mode === 'en-blur-zh') {
      html += `<div class="line-zh blurred" data-text="${escapeHtml(line.zh || '翻译中…')}">${escapeHtml(line.zh || '翻译中…')}</div>`;
    }

    div.innerHTML = html;

    // Click to seek
    div.addEventListener('click', () => {
      videoPlayer.currentTime = line.start || 0;
      currentLineIdx = i;
      renderTranscript();
    });

    // Click blurred to reveal
    const blurred = div.querySelector('.blurred');
    if (blurred) {
      blurred.addEventListener('click', (e) => {
        e.stopPropagation();
        blurred.classList.remove('blurred');
        blurred.classList.add('revealed');
      });
    }

    transcriptPanel.appendChild(div);
  });

  // Auto-scroll to active
  const active = transcriptPanel.querySelector('.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// Update video subtitle overlay
function updateSubtitle() {
  const mode = subtitleMode.value;
  // Find current line based on video time
  const t = videoPlayer.currentTime;
  let current = null;
  for (let i = lines.length - 1; i >= 0; i--) {
    if (lines[i].start <= t) { current = lines[i]; currentLineIdx = i; break; }
  }

  if (!current || mode === 'none') {
    subEn.style.display = 'none'; subZh.style.display = 'none'; return;
  }

  if (mode === 'en-only' || mode === 'en-blur-zh' || mode === 'both') {
    subEn.textContent = current.en || '';
    subEn.style.display = current.en ? 'inline-block' : 'none';
  } else { subEn.style.display = 'none'; }

  if (mode === 'zh-only' || mode === 'both') {
    subZh.textContent = current.zh || '';
    subZh.style.display = current.zh ? 'inline-block' : 'none';
  } else { subZh.style.display = 'none'; }
}

// Update subtitle on video timeupdate
videoPlayer.addEventListener('timeupdate', updateSubtitle);
subtitleMode.addEventListener('change', () => { renderTranscript(); updateSubtitle(); });

// Export subtitles
document.getElementById('exportSubBtn').addEventListener('click', () => {
  if (lines.length === 0) return;
  let srt = '';
  lines.forEach((l, i) => {
    const start = srtTime(l.start || 0);
    const end = srtTime(l.end || (l.start || 0) + 3);
    const text = subtitleMode.value.includes('zh') ? (l.zh || l.en) : l.en;
    srt += `${i+1}\n${start} --> ${end}\n${text}\n\n`;
  });
  const blob = new Blob([srt], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `听力练习-${Date.now()}.srt`;
  document.body.appendChild(a); a.click(); a.remove();
});

// Helpers
function fmtTime(sec) {
  if (sec == null) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
function srtTime(sec) {
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60),ms=Math.floor((sec%1)*1000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')},${String(ms).padStart(3,'0')}`;
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
